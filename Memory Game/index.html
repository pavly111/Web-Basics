<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Memory Game</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background-color: #f4f4f4;
      margin: 0;
      padding: 20px;
    }

    #title {
      font-size: 2em;
      margin-bottom: 10px;
    }

    #status {
      margin: 10px;
      font-weight: bold;
      color: green;
    }

    #container {
      display: grid;
      grid-template-columns: repeat(2, 200px);
      grid-gap: 30px;
      justify-content: center;
      margin: 20px auto;
    }

    .square {
      width: 200px;
      height: 200px;
      border-radius: 30px;
      transition: transform 0.2s ease;
      cursor: pointer;
    }

    .red { background-color: red; }
    .blue { background-color: blue; }
    .yellow { background-color: yellow; }
    .green { background-color: green; }

    .active {
      transform: scale(1.2);
      box-shadow: 0 0 20px white;
    }

    #startBtn {
      padding: 10px 20px;
      font-size: 18px;
      background-color: #444;
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }

    #startBtn:hover {
      background-color: #666;
    }

    #clickedSequence {
      margin-top: 20px;
      font-size: 1.1em;
    }
  </style>
</head>
<body>
<a href="../" style="position:fixed;top:20px;left:20px;text-decoration:none;background:#38bdf8;padding:10px;border-radius:10px;color:black;font-weight:bold;">
  ⬅ Back
</a>
  <div id="title">Color Says Game</div>
  <div id="status">Press "Start" to play</div>
  <button id="startBtn">Start</button>

  <div id="container">
    <div class="square red" data-color="red"></div>
    <div class="square blue" data-color="blue"></div>
    <div class="square yellow" data-color="yellow"></div>
    <div class="square green" data-color="green"></div>
  </div>

  <div id="clickedSequence">Clicked: </div>

  <script>
    const squares = document.querySelectorAll('.square');
    const startBtn = document.getElementById('startBtn');
    const statusText = document.getElementById('status');
    const clickedDisplay = document.getElementById('clickedSequence');

    const colors = ['red', 'blue', 'yellow', 'green'];
    let sequence = [];
    let userSequence = [];
    let level = 0;
    let canClick = false;

    function flashSquare(color) {
      const square = document.querySelector(`.square.${color}`);
      square.classList.add('active');
      setTimeout(() => {
        square.classList.remove('active');
      }, 500);
    }

    function playSequence() {
      let i = 0;
      canClick = false;
      const interval = setInterval(() => {
        flashSquare(sequence[i]);
        i++;
        if (i >= sequence.length) {
          clearInterval(interval);
          canClick = true;
        }
      }, 800);
    }

    function nextLevel() {
      level++;
      statusText.textContent = `Level ${level}`;
      userSequence = [];
      clickedDisplay.innerHTML = "Clicked: ";
      const nextColor = colors[Math.floor(Math.random() * 4)];
      sequence.push(nextColor);
      setTimeout(playSequence, 500);
    }

    function startGame() {
      level = 0;
      sequence = [];
      userSequence = [];
      clickedDisplay.innerHTML = "Clicked: ";
      statusText.style.color = "green";
      nextLevel();
    }

    function checkUserInput(color) {
      if (!canClick) return;
      userSequence.push(color);

      clickedDisplay.innerHTML = "Clicked: " + userSequence
        .map(c => `<span style="color: ${c}">${c.charAt(0).toUpperCase() + c.slice(1)}</span>`)
        .join(", ");

      const currentIndex = userSequence.length - 1;
      if (userSequence[currentIndex] !== sequence[currentIndex]) {
        statusText.textContent = `Game Over! You reached Level ${level}`;
        statusText.style.color = "red";
        canClick = false;
        return;
      }

      if (userSequence.length === sequence.length) {
        statusText.textContent = `🎉 Congrats! You passed Level ${level}`;
        statusText.style.color = "green";
        canClick = false;
        setTimeout(nextLevel, 1000);
      }
    }

    startBtn.addEventListener('click', startGame);

    squares.forEach(square => {
      square.addEventListener('click', () => {
        if (!canClick) return;
        const color = square.dataset.color;
        flashSquare(color);
        checkUserInput(color);
      });
    });
  </script>
</body>
</html>
