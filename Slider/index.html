<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Slider with Animation</title>
  <style>
    body {
      background: #f0f0f0;
      display: flex;
      justify-content: center;
      padding: 50px 20px;
      min-height: 100vh;
      margin: 0;
    }

    .container {
      position: relative;
      width: 90%;
      max-width: 700px;
      aspect-ratio: 1 / 1;
      overflow: hidden;
      border-radius: 10px;
      background: #000;
    }

    .slider {
      display: flex;
      transition: transform 0.5s ease-in-out;
      width:100%;
      height: 100%;
    }

    .slide {
      min-width: 100%;
    }

    .slide img {
      width: 100%;
      display: block;
      height: 100%;
    }

    .prev, .next {
      position: absolute;
      top: 50%;
      width: 30px;
      height: 30px;
      font-size: 30px;
      padding: 10px;
      display: flex;
      justify-content: space-around;
      color: white;
      cursor: pointer;
      background-color: rgba(0,0,0,0.3);
      border-radius: 50%;
      transform: translateY(-50%);
      z-index: 10;
    }

    .prev { left: 10px; }
    .next { right: 10px; }

    .dots {
    position: absolute;
    bottom: 10px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 10;
    padding: 5px 10px;
    background: rgba(0, 0, 0, 0.3);
    border-radius: 20px;
    }

    .dot {
    height: 10px;
    width: 10px;
    margin: 0 4px;
    display: inline-block;
    border-radius: 50%;
    background-color: #ccc;
    cursor: pointer;
    transition: background-color 0.3s;
    }

    .dot.active {
    background-color: white;
    }
  </style>
</head>
<body>
<a href="../" style="position:fixed;top:20px;left:20px;text-decoration:none;background:#38bdf8;padding:10px;border-radius:10px;color:black;font-weight:bold;">
  ⬅ Back
</a>

<div class="container">
  <div class="slider" id="slider">
    <div class="slide"><img src="Screenshot 2025-07-02 at 8.26.23 PM.png" /></div>
    <div class="slide"><img src="Screenshot 2025-07-03 at 8.13.50 PM.png" /></div>
    <div class="slide"><img src="Screenshot 2025-07-03 at 8.18.20 PM.png" /></div>
    <div class="slide"><img src="Screenshot 2025-07-05 at 10.14.18 AM.png" /></div>
  </div>

  <a class="prev" onclick="prevSlide()">❮</a>
  <a class="next" onclick="nextSlide()">❯</a>

  <div class="dots">
    <span class="dot active" onclick="goToSlide(0)"></span>
    <span class="dot" onclick="goToSlide(1)"></span>
    <span class="dot" onclick="goToSlide(2)"></span>
    <span class="dot" onclick="goToSlide(3)"></span>
  </div>
</div>

<script>
let slideIndex = 0;
const slider = document.getElementById("slider");
const dots = document.querySelectorAll(".dot");
const totalSlides = document.querySelectorAll(".slide").length;

function update() {
  slider.style.transform = `translateX(-${slideIndex * 100}%)`;

  dots.forEach(dot => dot.classList.remove("active"));
  dots[slideIndex].classList.add("active");
}

function nextSlide() {
  slideIndex = (slideIndex + 1) % totalSlides;
  update();
}

function prevSlide() {
  slideIndex = (slideIndex - 1 + totalSlides) % totalSlides;
  update();
}

function goToSlide(index) {
  slideIndex = index;
  update();
}
</script>

</body>
</html>
