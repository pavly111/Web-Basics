<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login Page</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      background: #f0f0f0;
    }

    .container {
      width: 90%;
      max-width: 800px;
      height: 500px;
      margin: 7% auto;
      position: relative;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 4px 4px 20px rgba(0, 0, 0, 0.2);
      display: flex;
      transition: transform 0.6s ease-in-out;
    }

    .form-section,
    .brown-section {
      width: 50%;
      height: 100%;
      padding: 60px 40px;
      position: absolute;
      top: 0;
      transition: all 0.6s ease-in-out;
      opacity: 1;
      visibility: visible;
    }

    .form-section {
      background: #fff;
      left: 0;
      z-index: 1;
      transform: translateX(0);
      transition: all 0.6s ease-in-out;
    }

    .form-section h2 {
      font-size: 28px;
      color: brown;
      margin-bottom: 20px;
    }

    .form-section input {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }

    .form-section button {
      width: 100%;
      padding: 12px;
      margin-top: 20px;
      background: white;
      color: brown;
      border: 2px solid brown;
      font-size: 16px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.3s;
    }

    .form-section button:hover {
      background: brown;
      color: white;
    }

    .brown-section {
      background: brown;
      color: white;
      right: 0;
      z-index: 1;
      text-align: center;
      transition: all 0.6s ease-in-out;
      transform: translateX(0);
    }

    .brown-section h2 {
      font-size: 26px;
      margin-bottom: 15px;
    }

    .brown-section p {
      font-size: 16px;
      margin-bottom: 30px;
    }

    .brown-section button {
      padding: 10px 30px;
      background: white;
      color: brown;
      font-size: 16px;
      border: none;
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.3s;
    }

    .brown-section button:hover {
      background: #f5f5f5;
    }

    .hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .switch-active .form-section {
      transform: translateX(100%);
      transition: all 0.6s ease-in-out;
    }

    .switch-active .brown-section {
      transform: translateX(-100%);
      transition: all 0.6s ease-in-out;
    }

    .error {
      color: red;
      font-size: 14px;
    }

    .password-wrapper {
      position: relative;
    }

    .password-wrapper input {
      padding-right: 40px;
    }

    .toggle-password {
      position: absolute;
      top: 50%;
      right: 10px;
      transform: translateY(-50%);
      cursor: pointer;
      font-size: 16px;
      color: gray;
    }
    @media(max-width: 768px) {
      .container {
        flex-direction: column;
        height: auto;
        min-height: 500px;
      }
      .form-section, .brown-section {
        width: 100%;
        position: relative;
        padding: 40px 20px;
      }
      .brown-section {
        right: auto;
      }
      .switch-active .form-section {
        transform: translateX(0);
      }
      .switch-active .brown-section {
        transform: translateX(0);
      }
    }
  </style>
</head>
<body>
<a href="../" style="position:fixed;top:20px;left:20px;text-decoration:none;background:#38bdf8;padding:10px;border-radius:10px;color:black;font-weight:bold;">
  ⬅ Back
</a>

<div id="container" class="container">
  <div id="1" class="form-section">
    <h2>Sign In</h2>
    <form onsubmit="return validateSignIn()">
      <input type="email" id="signin-email" placeholder="Email" required />
      <div class="error" id="emailError"></div>

      <div class="password-wrapper">
        <input type="password" id="signin-password" placeholder="Password" required />
        <span class="toggle-password" onclick="togglePassword('signin-password')">👁️</span>
      </div>

      <button type="submit">Sign In</button>
    </form>
  </div>

  <div id="2" class="brown-section">
    <h2>Welcome!</h2>
    <p>New here? Click below to create an account.</p>
    <button onclick="switchToSignup()">Sign Up</button>
  </div>

  <div id="3" class="form-section hidden">
    <h2>Sign Up</h2>
    <form onsubmit="return validateSignUp()">
      <input type="text" id="signup-name" placeholder="Full Name" required />
      <input type="email" id="signup-email" placeholder="Email" required />
      <div class="password-wrapper">
        <input type="password" id="signup-password" placeholder="Password" required />
        <span class="toggle-password" onclick="togglePassword('signup-password')">👁️</span>
      </div>
      <button type="submit">Sign Up</button>
    </form>
  </div>

  <div id="4" class="brown-section hidden">
    <h2>Welcome Back!</h2>
    <p>If you already have an account, click below to log in.</p>
    <button onclick="switchToSignin()">Sign In</button>
  </div>
</div>

<script>
  function togglePassword(fieldId) {
    const field = document.getElementById(fieldId);
    field.type = field.type === "password" ? "text" : "password";
  }

  function validateSignIn() {
    const email = document.getElementById("signin-email").value;
    const emailError = document.getElementById("emailError");
    if (!email.includes("@")) {
      emailError.textContent = "Invalid email format.";
      return false;
    }
    emailError.textContent = "";
    alert("Signed in successfully!");
    return false;
  }

  function validateSignUp() {
    const email = document.getElementById("signup-email").value;
    if (!email.includes("@")) {
      alert("Please enter a valid email.");
      return false;
    }
    alert("Signed up successfully!"); 
    return false;
  }

  function switchToSignup() {
    document.getElementById("container").classList.add("switch-active");
    
    setTimeout(() => {
      document.getElementById("1").classList.add("hidden");
      document.getElementById("2").classList.add("hidden");
      document.getElementById("3").classList.remove("hidden");
      document.getElementById("4").classList.remove("hidden");
    }, 300);
  }

  function switchToSignin() {
    document.getElementById("container").classList.remove("switch-active");
    
    setTimeout(() => {
      document.getElementById("3").classList.add("hidden");
      document.getElementById("4").classList.add("hidden");
      document.getElementById("1").classList.remove("hidden");
      document.getElementById("2").classList.remove("hidden");
    }, 300);
  }
</script>

</body>
</html>
