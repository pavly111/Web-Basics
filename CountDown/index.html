<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CountDown</title>
  <style>
    body {
      background-color: black;
      font-family: Arial, sans-serif;
      position: relative;
      overflow: hidden;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    h2 {
      color: white;
      text-align: center;
      font-size: clamp(1.8rem, 5vw, 50px);
      margin-top: 20px;
    }

    .timer-container {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: clamp(15px, 5vw, 40px);
      margin-top: 50px;
      flex-wrap: wrap;
    }

    .time-box {
      text-align: center;
      color: white;
    }

    .time-value {
      font-size: clamp(2rem, 8vw, 60px);
    }

    .time-label {
      font-size: clamp(0.9rem, 3vw, 24px);
      margin-top: 10px;
      color: #cccccc;
    }

    .controls {
      text-align: center;
      margin-top: 60px;
    }

    button {
      font-size: clamp(0.9rem, 3vw, 24px);
      width: clamp(80px, 20vw, 120px);
      height: clamp(36px, 8vw, 50px);
      color: white;
      background-color: blue;
      border: none;
      border-radius: 20px;
      margin: 0 10px;
      cursor: pointer;
    }

    button:hover {
      background-color: darkblue;
    }

    .motivation {
      position: absolute;
      top: 40%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: white;
      font-size: clamp(1.5rem, 5vw, 40px);
      opacity: 0.3;
      pointer-events: none;
      margin-top: 300px;
    }

    @media(max-width: 480px) {
      .controls { margin-top: 30px; }
      button { margin: 5px; }
      .motivation { margin-top: 200px; }
    }
  </style>
</head>
<body>
<a href="../" style="position:fixed;top:20px;left:20px;text-decoration:none;background:#38bdf8;padding:10px;border-radius:10px;color:black;font-weight:bold;">
  ⬅ Back
</a>
  <h2>Exam CountDown</h2>

  <div class="motivation">Don't Give Up!</div>

  <div class="timer-container">
    <div class="time-box">
      <div id="minutes" class="time-value">01</div>
      <div class="time-label">Minutes</div>
    </div>
    <div class="time-box">
      <div id="seconds" class="time-value">00</div>
      <div class="time-label">Seconds</div>
    </div>
  </div>

  <div class="controls">
    <button onclick="start()">Start</button>
    <button onclick="stop()">Stop</button>
    <button onclick="reset()">Reset</button>
  </div>

  <script>
    let totalTime = 60;
    let time = totalTime;
    let countdown;
    let isRunning = false;
    let halfAlertShown = false;

    const minutesDisplay = document.getElementById('minutes');
    const secondsDisplay = document.getElementById('seconds');

    function update() {
      const min = String(Math.floor(time / 60)).padStart(2, '0');
      const sec = String(time % 60).padStart(2, '0');
      minutesDisplay.textContent = min;
      secondsDisplay.textContent = sec;
    }

    function start() {
      if (isRunning) return;
      isRunning = true;
      countdown = setInterval(() => {
        if (time <= 0) {
          clearInterval(countdown);
          isRunning = false;
          alert("Time's up! You did your best.");
          return;
        }
        if (!halfAlertShown && time <= totalTime / 2) {
          alert("Halfway there! Keep going! 30 Seconds left!");
          halfAlertShown = true;
        }
        time--;
        update();
      }, 1000);
    }

    function stop() {
      clearInterval(countdown);
      isRunning = false;
    }

    function reset() {
      clearInterval(countdown);
      time = totalTime;
      halfAlertShown = false;
      update();
      isRunning = false;
    }

    update();
  </script>
</body>
</html>
