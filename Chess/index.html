<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chess Board</title>
    <link rel="stylesheet" href="chess.css">
</head>
<body>
<a href="../" style="position:fixed;top:20px;left:20px;text-decoration:none;background:#38bdf8;padding:10px;border-radius:10px;color:black;font-weight:bold;">
  ⬅ Back
</a>
    <div class="chess">
        <div class="white">♜</div><div class="black">♞</div><div class="white">♝</div><div class="black">♛</div><div class="white">♚</div><div class="black">♝</div><div class="white">♞</div><div class="black">♜</div>
        <div class="black">♟</div><div class="white">♟</div><div class="black">♟</div><div class="white">♟</div><div class="black">♟</div><div class="white">♟</div><div class="black">♟</div><div class="white">♟</div>
        <div class="white"></div><div class="black"></div><div class="white"></div><div class="black"></div><div class="white"></div><div class="black"></div><div class="white"></div><div class="black"></div>
        <div class="black"></div><div class="white"></div><div class="black"></div><div class="white"></div><div class="black"></div><div class="white"></div><div class="black"></div><div class="white"></div>
        <div class="white"></div><div class="black"></div><div class="white"></div><div class="black"></div><div class="white"></div><div class="black"></div><div class="white"></div><div class="black"></div>
        <div class="black"></div><div class="white"></div><div class="black"></div><div class="white"></div><div class="black"></div><div class="white"></div><div class="black"></div><div class="white"></div>
        <div class="white">♙</div><div class="black">♙</div><div class="white">♙</div><div class="black">♙</div><div class="white">♙</div><div class="black">♙</div><div class="white">♙</div><div class="black">♙</div>
        <div class="black">♖</div><div class="white">♘</div><div class="black">♗</div><div class="white">♕</div><div class="black">♔</div><div class="white">♗</div><div class="black">♘</div><div class="white">♖</div>
    </div>
    <style>
        body {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    background-color: #f0f0f0;
    margin: 0;
}

.chess {
    display: grid;
    grid-template-columns: repeat(8, 60px);
    grid-template-rows: repeat(8, 60px);
    border: 10px solid burlywood;
    box-shadow: 0 0 20px rgba(0,0,0,0.3);
}

.white, .black {
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 45px;
    cursor: pointer;
    transition: background-color 0.3s;
}

.white {
    background-color: #f0d9b5;
}

.black {
    background-color: #b58863;
}

.white:hover {
    background-color: #e9cfa3;
    box-shadow: inset 0 0 10px rgba(0,0,0,0.2);
}

.black:hover {
    background-color: #a47a52;
    box-shadow: inset 0 0 10px rgba(0,0,0,0.3);
}
    </style>
</body>
</html>
