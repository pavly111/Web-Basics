<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Nav</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    nav {
      background-color: cadetblue;
      width: 500px;
      border-radius: 100px;
      padding: 10px 20px;
      display: flex;
      justify-content: center;
      margin: 30px auto;
    }

    .menu {
      position: relative;
      margin: 0 10px;
    }

    .menu > button {
      background-color: transparent;
      color: white;
      border: none;
      padding: 10px 15px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
      position: relative;
      transition: color 0.3s ease;
    }

    .menu > button::after {
      content: "";
      position: absolute;
      left: 15px;
      bottom: 8px;
      width: 0;
      height: 2px;
      background-color: white;
      transition: width 0.3s ease;
    }

    .menu > button:hover::after {
      width: calc(100% - 30px);
    }

    .dropdown {
      display: none;
      position: absolute;
      top: 100%;
      left: 0;
      background-color: white;
      min-width: 160px;
      box-shadow: 0 8px 16px rgba(0,0,0,0.2);
      border-radius: 10px;
      z-index: 1000;
    }

    .dropdown a {
      color: black;
      padding: 10px 15px;
      text-decoration: none;
      display: block;
      position: relative;
      transition: color 0.3s ease;
    }

    .dropdown a::after {
      content: "";
      position: absolute;
      left: 15px;
      bottom: 8px;
      width: 0;
      height: 2px;
      background-color: cadetblue;
      transition: width 0.3s ease;
    }

    .dropdown a:hover {
      color: cadetblue;
    }

    .dropdown a:hover::after {
      width: calc(100% - 30px);
    }

    .menu:hover .dropdown {
      display: block;
    }

    footer {
      background-color: cadetblue;
      padding: 30px 20px;
      display: flex;
      justify-content: center;
      gap: 40px;
      flex-wrap: wrap;
      color: white;
      font-family: sans-serif;
      margin-top: auto;
    }

    .cat {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .cat > a,
    .content > a {
      color: white;
      text-decoration: none;
      font-weight: bold;
    }

    .content > a {
      font-weight: normal;
    }
  </style>
</head>
<body>

  <nav>
    <div class="menu">
      <button>contact</button>
      <div class="dropdown">
        <a href="#">whatsapp</a>
        <a href="#">email</a>
        <a href="#">phone number</a>
      </div>
    </div>
    <div class="menu">
      <button>home</button>
      <div class="dropdown">
        <a href="#">page 1</a>
        <a href="#">page 2</a>
        <a href="#">page 3</a>
        <a href="#">page 4</a>
      </div>
    </div>
    <div class="menu">
      <button>social</button>
      <div class="dropdown">
        <a href="#">linkedin</a>
        <a href="#">facebook</a>
        <a href="#">instagram</a>
        <a href="#">twitter</a>
      </div>
    </div>
    <div class="menu">
      <button>about</button>
    </div>
  </nav>

  <div style="flex-grow: 1;"></div>

  <footer>
    <div class="cat">
      <a href="#">contact</a>
      <div class="content"><a href="#">12213</a></div>
      <div class="content"><a href="#">somewhere</a></div>
      <div class="content"><a href="#">state</a></div>
      <div class="content"><a href="#">0123276663246</a></div>
    </div>
    <div class="cat">

      <div class="content"><a href="#">somewhere</a></div>

    </div>
    <div class="cat">

</body>
</html>
